name: todays first pipeline
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
       - name: bring the code
         uses: actions/checkout@v3

       - name: node setup karo ubuntu pe
         uses: actions/setup-node@v3
         with:
             node-version: "18"

       - name: package.json install karo
         run: npm install

       - name: Tests chalao
         run: npm test

